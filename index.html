<!DOCTYPE html>
<html lang="ja">
<head>

      text-align: center;
      margin-top: 30px;
    }

    img {

      height: 300px;
      object-fit: cover;
      border-radius: 10px;
    }

    input {

      margin-top: 15px;

      margin-left: 10px;
    }

      font-weight: bold;
    }
  </style>
</head>
<body>

    function nextQuiz() {

      const randomImage =
        images[Math.floor(Math.random() * images.length)];

      document.getElementById("quizImage").src =
        "images/" + randomImage;

      currentAnswer =
        randomImage.replace(".jpg", "");

      document.getElementById("answer").value = "";
    }

    function checkAnswer() {

      const userAnswer =
        document.getElementById("answer").value.trim();

      if(userAnswer === currentAnswer) {

        document.getElementById("result").innerText =
          "正解！";

      } else {

        document.getElementById("result").innerText =
          "不正解！ 正解は " + currentAnswer;

      }

      setTimeout(nextQuiz, 1500);
    }

    nextQuiz();
  </script>
